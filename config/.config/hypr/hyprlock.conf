general {
grace = 0
hide_cursor = true
ignore_empty_input = true
immediate_render = true
}

# ============================================================
# BACKGROUND
# ============================================================

background {
monitor =
path = screenshot

blur_size = 8
blur_passes = 3

noise = 0.008
contrast = 1.05
brightness = 0.52
vibrancy = 0.12
vibrancy_darkness = 0.15
}

# ============================================================
# TIME
# ============================================================

label {
monitor =
text = cmd[update:1000] echo "$(date +'%I:%M')"

color = rgba(245,245,245,1.0)
font_size = 92
font_family = JetBrainsMono Nerd Font

position = 0, 205
halign = center
valign = center

shadow_passes = 2
shadow_size = 4
shadow_color = rgba(0,0,0,0.45)
}

label {
monitor =
text = cmd[update:1000] echo "$(date +'%p')"

color = rgba(145,155,170,1.0)
font_size = 17
font_family = JetBrainsMono Nerd Font

position = 0, 135
halign = center
valign = center
}

label {
monitor =
text = cmd[update:60000] echo "$(date +'%A, %B %-d, %Y')"

color = rgba(185,190,200,1.0)
font_size = 20
font_family = JetBrainsMono Nerd Font

position = 0, 90
halign = center
valign = center
}

# ============================================================
# USER
# ============================================================

label {
monitor =
text =  $USER

color = rgba(220,225,230,1.0)
font_size = 17
font_family = JetBrainsMono Nerd Font

position = 0, -20
halign = center
valign = center
}

# ============================================================
# PASSWORD
# ============================================================

input-field {
monitor =

size = 420, 58
outline_thickness = 2
rounding = 14

dots_size = 0.20
dots_spacing = 0.20
dots_center = true
dots_rounding = -1

outer_color = rgba(80,150,255,0.85)
inner_color = rgba(18,22,30,0.90)

check_color = rgba(70,200,130,0.95)
fail_color = rgba(235,80,95,0.95)
capslock_color = rgba(245,180,65,0.95)

font_color = rgba(235,240,245,1.0)
font_family = JetBrainsMono Nerd Font

fade_on_empty = false

placeholder_text = <span foreground="##7f8999">Enter password</span>
fail_text = <span foreground="##eb505f">$FAIL</span>

fail_timeout = 2500
fail_transition = 250

hide_input = false

position = 0, -85
halign = center
valign = center

shadow_passes = 3
shadow_size = 7
shadow_color = rgba(0,0,0,0.45)
}

# ============================================================
# NETWORK
# ============================================================

label {
monitor =

text = cmd[update:5000] ssid=$(nmcli -t -f active,ssid dev wifi 2>/dev/null | sed -n 's/^yes://p' | head -n1) ; if [ -n "$ssid" ]; then echo "󰖩  $ssid"; else echo "󰖪  Offline"; fi

color = rgba(165,175,190,0.90)
font_size = 14
font_family = JetBrainsMono Nerd Font

position = 35, 30
halign = left
valign = bottom
}

# ============================================================
# BATTERY
# ============================================================

label {
monitor =

text = cmd[update:10000] BAT=$(find /sys/class/power_supply -maxdepth 1 -name 'BAT*' | head -n1) ; if [ -n "$BAT" ]; then cap=$(cat "$BAT/capacity"); stat=$(cat "$BAT/status"); if [ "$stat" = "Charging" ]; then icon="󰂄"; elif [ "$cap" -ge 80 ]; then icon="󰁹"; elif [ "$cap" -ge 60 ]; then icon="󰂀"; elif [ "$cap" -ge 40 ]; then icon="󰁾"; elif [ "$cap" -ge 20 ]; then icon="󰁼"; else icon="󰂃"; fi; echo "$icon  ${cap}%"; fi

color = rgba(165,175,190,0.90)
font_size = 14
font_family = JetBrainsMono Nerd Font

position = -35, 30
halign = right
valign = bottom
}

# ============================================================
# SYSTEM
# ============================================================

label {
monitor =

text = cmd[update:60000] echo "󰌢  $(hostname)  •  $(uptime -p | sed 's/^up //')"

color = rgba(125,135,150,0.80)
font_size = 12
font_family = JetBrainsMono Nerd Font

position = 35, 65
halign = left
valign = bottom
}

# ============================================================
# KEYBOARD
# ============================================================

label {
monitor =
text = 󰌌 $LAYOUT

color = rgba(125,135,150,0.80)
font_size = 12
font_family = JetBrainsMono Nerd Font

position = -35, 65
halign = right
valign = bottom
}

# ============================================================
# MEDIA
# ============================================================

label {
monitor =

text = cmd[update:2000] status=$(playerctl status 2>/dev/null) ; if [ "$status" = "Playing" ] || [ "$status" = "Paused" ]; then artist=$(playerctl metadata artist 2>/dev/null); title=$(playerctl metadata title 2>/dev/null); if [ "$status" = "Playing" ]; then icon="󰏤"; else icon="󰐊"; fi; echo "$icon  $artist — $title"; fi

color = rgba(180,190,205,0.90)
font_size = 14
font_family = JetBrainsMono Nerd Font

position = 0, -225
halign = center
valign = center
}
